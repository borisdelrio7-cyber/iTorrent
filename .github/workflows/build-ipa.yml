# Compila iTorrent sin firmar y lo empaqueta como iTorrent.ipa para instalarlo con `xtool install`.
# xtool re-firma el .ipa con tu equipo, así que aquí no se usan certificados ni perfiles.

name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si haces dos push seguidos, el build viejo se cancela en vez de gastar otra máquina macOS.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # El código del autor usa APIs del SDK de iOS 27 (p. ej. GeometryProxy.reservedRegions,
    # para el iPhone plegable), que sólo trae Xcode 27. macos-latest (macOS 26) sólo tiene
    # Xcode 26.x, así que se usa la imagen xcode-27 (macOS 27). Cuando GitHub publique
    # macos-27 como imagen estable, se puede cambiar a esa etiqueta.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      # La versión estable por defecto de la imagen xcode-27.
      XCODE_VERSION: "27.1"
      SCHEME: iTorrent
      # xtool sólo puede registrar App Groups si inició sesión con Apple ID (xtool auth login
      # con usuario y contraseña). Con una clave de App Store Connect el perfil sale sin grupos
      # y iOS rechaza la app si el binario pide uno (0xe8008015). Sin grupo, lo único que se
      # pierde es que la Live Activity no lee el color de acento elegido en la app.
      EMBED_APP_GROUP: "false"

    steps:
      - name: Seleccionar Xcode ${{ env.XCODE_VERSION }}
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Xcode ${XCODE_VERSION} no está en esta imagen. Versiones disponibles:"
            ls -d /Applications/Xcode_*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      # libtorrent, VLC, MVVMFoundation y GCDWebServer vienen como submódulos de git.
      - name: Checkout (con submódulos)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # libtorrent depende de Boost; make.sh genera con CMake el proyecto Xcode de libtorrent
      # que el workspace compila después junto con la app.
      - name: Preparar libtorrent
        run: |
          brew install boost

          # make.sh pide macOS 10.13 e iOS 15.0, pero Xcode 27 sólo acepta macOS >= 12.0.
          # Se ajusta la copia del checkout (el submódulo no cambia); la app ya exige iOS 16.
          sed -i '' \
            -e 's/CMAKE_OSX_DEPLOYMENT_TARGET=10.13/CMAKE_OSX_DEPLOYMENT_TARGET=12.0/' \
            -e 's/IPHONEOS_DEPLOYMENT_TARGET=15.0/IPHONEOS_DEPLOYMENT_TARGET=16.0/' \
            Submodules/LibTorrent-Swift/make.sh
          grep -E 'OSX_DEPLOYMENT_TARGET=12.0|IPHONEOS_DEPLOYMENT_TARGET=16.0' Submodules/LibTorrent-Swift/make.sh

          cmake --version | head -1
          xcrun --find clang
          if ! ./Submodules/LibTorrent-Swift/make.sh; then
            # CMake sólo dice "compiler identification is unknown"; el motivo real queda en este log.
            tail -n 150 Submodules/LibTorrent-Swift/libtorrent-build/CMakeFiles/CMakeConfigureLog.yaml || true
            exit 1
          fi

      # Descarga los paquetes SwiftPM fijados en Package.resolved (Firebase, OpenSSL, libvlc, etc.).
      - name: Resolver dependencias SwiftPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace iTorrent.xcworkspace \
            -scheme "$SCHEME" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      # archive (y no build) para obtener el .app de Release igual que una versión publicada:
      # símbolos separados en dSYM y binario más liviano.
      - name: Compilar Release para iPhone (sin firmar)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace iTorrent.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iTorrent.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -nE "error:|\*\* ARCHIVE FAILED|Build input file cannot be found" "$RUNNER_TEMP/xcodebuild.log" | head -100 || true

      - name: Subir log de xcodebuild
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      # Con CODE_SIGNING_ALLOWED=NO, Xcode no escribe los entitlements en el binario.
      # xtool decide qué capacidades registrar (App Groups, etc.) leyendo los entitlements
      # del binario, así que sin este paso el widget y la app quedarían sin App Group.
      # La firma "ad-hoc" (-) no usa certificado: sólo guarda hashes + entitlements,
      # y xtool la reemplaza por tu firma real al instalar.
      - name: Incrustar entitlements (firma ad-hoc)
        run: |
          APP="$RUNNER_TEMP/iTorrent.xcarchive/Products/Applications/iTorrent.app"

          # Las claves com.apple.security.* de estos archivos son del sandbox de macOS/visionOS;
          # en iOS la única que importa es el App Group (y sólo si EMBED_APP_GROUP=true).
          ios_entitlements() {
            python3 - "$1" "$2" <<'PY'
          import os, plistlib, sys
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, "rb") as f:
              ents = plistlib.load(f)
          group = "com.apple.security.application-groups"
          keep_group = os.environ.get("EMBED_APP_GROUP") == "true"
          keep = {k: v for k, v in ents.items()
                  if not k.startswith("com.apple.security.") or (k == group and keep_group)}
          with open(dst, "wb") as f:
              plistlib.dump(keep, f)
          print(f"{src}: {sorted(keep)}")
          PY
          }
          ios_entitlements iTorrent/Core/Assets/iTorrent.entitlements "$RUNNER_TEMP/app.entitlements"
          ios_entitlements ProgressWidget/ProgressWidgetExtension.entitlements "$RUNNER_TEMP/widget.entitlements"

          sign() { codesign --force --sign - --timestamp=none "$@"; }

          # De adentro hacia afuera: codesign exige que el código anidado ya esté firmado.
          find "$APP" -depth \( -name "*.framework" -o -name "*.dylib" \) -print0 |
            while IFS= read -r -d '' item; do sign "$item"; done

          for appex in "$APP"/PlugIns/*.appex; do
            [ -e "$appex" ] || continue
            case "$(basename "$appex")" in
              ProgressWidgetExtension.appex) sign --entitlements "$RUNNER_TEMP/widget.entitlements" "$appex" ;;
              *) sign "$appex" ;;
            esac
          done

          sign --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true

      - name: Empaquetar iTorrent.ipa
        run: |
          APP="$RUNNER_TEMP/iTorrent.xcarchive/Products/Applications/iTorrent.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          # Las extensiones (widget / Live Activity) ya vienen dentro de iTorrent.app/PlugIns
          # porque Xcode las embebe al compilar; sólo verificamos que estén.
          if ! ls "$RUNNER_TEMP/ipa/Payload/iTorrent.app/PlugIns/"*.appex >/dev/null 2>&1; then
            echo "::error::No hay extensiones en iTorrent.app/PlugIns"
            exit 1
          fi

          cd "$RUNNER_TEMP/ipa"
          zip -qry iTorrent.ipa Payload

          INFO=Payload/iTorrent.app/Info.plist
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$INFO")"
          echo "Versión:   $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$INFO") ($(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$INFO"))"
          echo "Extensiones:"; ls Payload/iTorrent.app/PlugIns
          ls -lh iTorrent.ipa

      - name: Subir iTorrent.ipa
        uses: actions/upload-artifact@v5
        with:
          name: iTorrent-ipa
          path: ${{ runner.temp }}/ipa/iTorrent.ipa
          retention-days: 14
          # El .ipa ya es un zip; no tiene sentido recomprimirlo.
          compression-level: 0
